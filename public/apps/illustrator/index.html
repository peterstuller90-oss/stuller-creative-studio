<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stullers Illustrator</title>
<link rel="stylesheet" href="../../hub-ui-font.css">
<style>
/* Stullers Illustrator: kresba z fotky Štullers čiarou, až 6 fotiek naraz v mriežke.
   Hore návrh (názov, uložiť, otvoriť), pod ním spoločné nastavenia, potom mriežka kariet, každá karta = jedna fotka. */
:root{
  --mint:#acffd3; --ink:#5b4b7a; --coral:#f66c85; --muted:#8a7fa0; --card:#ffffff; --field:#f7f5fb; --paper:#ffffff;
  --line:#5b4b7a; --soft:#e6e1ef; --ok:#1d7a46;
  --b:2px solid var(--ink); --sh:0 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--mint);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-weight:500;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 40px) max(14px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:14px}

/* návrh */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.title{display:flex;flex-direction:column;flex:1 1 260px;min-width:0}
.title small{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.title input{border:none;background:none;font-size:26px;padding:2px 0;min-width:0;width:100%;text-transform:uppercase;border-bottom:2px dashed transparent}
.title input:hover,.title input:focus{border-bottom-color:var(--ink);outline:none}
.saved{font-size:14px;color:var(--muted)}
.btn{border:var(--b);background:var(--card);border-radius:999px;padding:8px 16px;min-height:42px;box-shadow:0 3px 0 var(--ink);text-transform:uppercase;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.coral{background:var(--coral);color:#fff;border-color:var(--ink)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}

/* spoločné nastavenia */
.bar{background:var(--card);border:var(--b);border-radius:24px;box-shadow:var(--sh);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px 16px;align-items:center}
@media (max-width:980px){.bar{grid-template-columns:minmax(0,1fr) auto}.bar .common{grid-column:1/-1;order:3}.bar .lvall{order:4}.bar .view{order:5;grid-column:1/-1}}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.common{display:flex;flex-direction:column;gap:4px;min-width:0}
.lab{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.common input{width:100%;border:var(--b);border-radius:14px;background:var(--field);padding:9px 12px}
.lvall{display:flex;flex-direction:column;gap:4px}
.levels{display:flex;gap:4px}
.levels button{width:36px;height:36px;border:var(--b);border-radius:12px;background:var(--field);padding:0}
.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
.view{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;grid-column:1/-1;border-top:2px dashed var(--soft);padding-top:12px}
.view label{display:flex;align-items:center;gap:8px;font-size:15px}
.view input[type=range]{width:140px;accent-color:var(--ink)}
.view input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.view .grow{flex:1}
.count{font-size:15px;color:var(--muted)}

/* mriežka */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:var(--b);border-radius:24px;box-shadow:var(--sh);padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card.big{grid-column:1/-1}
.card.big .cv{max-width:1100px;margin:0 auto;width:100%}
.cv{position:relative;background:var(--paper);border:2px solid var(--soft);border-radius:16px;overflow:hidden}
.cv svg{display:block;width:100%;height:auto}
.busy{position:absolute;inset:0;background:rgba(255,255,255,.78);display:grid;place-items:center;text-align:center;padding:14px;font-size:17px}
.busy .spin{width:34px;height:34px;margin:0 auto 8px;border-radius:50%;border:4px solid var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.busy .btn{margin-top:10px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.meta{font-size:14px;color:var(--muted);flex:1;min-width:0}
.icon{width:36px;height:36px;border:var(--b);border-radius:12px;background:var(--card);display:grid;place-items:center;padding:0;font-size:17px;line-height:1}
.card textarea{width:100%;min-height:54px;resize:vertical;border:var(--b);border-radius:14px;background:var(--field);padding:7px 10px;font-size:15px}
.acts{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:6px}
.acts .btn{padding-inline:8px}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.status.err{color:#c0263f}
.menu{display:flex;flex-wrap:wrap;gap:6px;border-top:2px dashed var(--soft);padding-top:9px}
.menu .del{margin-left:auto;color:#c0263f}
.empty{border:2px dashed var(--ink);border-radius:24px;min-height:220px;display:grid;place-items:center;text-align:center;padding:20px;position:relative;color:var(--ink);background:rgba(255,255,255,.45)}
.empty b{display:block;font-size:22px;text-transform:uppercase;font-weight:500}
.empty span{color:var(--muted)}
.empty input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.empty.over,.cv.over{background:#fff;box-shadow:inset 0 0 0 3px var(--coral)}
.intro{grid-column:1/-1;min-height:300px}
.intro ul{text-align:left;margin:12px auto 0;max-width:460px;color:var(--muted);padding-left:20px}

/* návrhy */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(40,30,60,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.sheet{align-items:center}}
.panel{background:#fff;border:var(--b);border-radius:24px;box-shadow:var(--sh);width:100%;max-width:720px;max-height:82dvh;display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px dashed var(--soft)}
.panel h2{margin:0;font-size:22px;text-transform:uppercase;font-weight:500;flex:1}
.list{overflow:auto;padding:12px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{border:var(--b);border-radius:16px;background:var(--field);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative}
.item img{width:100%;aspect-ratio:3/2;object-fit:cover;background:#fff;border-radius:10px;display:block}
.item strong{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{font-size:13px;color:var(--muted)}
.item .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:var(--b);background:#fff;padding:0}
.list .none{grid-column:1/-1;color:var(--muted);padding:20px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;z-index:200;font-size:15px;max-width:calc(100vw - 32px);text-align:center}
.note{background:#fff7d6;border:var(--b);border-radius:16px;padding:10px 14px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.btn,.levels button{transition:background .15s,color .15s}.card{animation:in .25s cubic-bezier(.33,0,.67,1)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>

<div class="wrap">
  <div class="top">
    <div class="title">
      <small>Stullers Illustrator</small>

    <button class="btn" id="newBtn">Nový</button>

  <div class="note" id="note" hidden></div>

  <main class="grid" id="grid"></main>
</div>

<div class="sheet" id="sheet" hidden>

    <div class="list" id="list"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

const STYLE = `You are drawing like the Slovak illustrator Peter Štuller (Štullers). He traces over a photo in Illustrator with the Pencil tool: one uniform black line, about 1 mm, round caps and round joins, no fills, no shading. What his drawings look like (learned from screen recordings of him drawing):
1. ORDER: first the dominant subject and its big silhouette (castle keep, ridge, rock edge), then interior lines (cracks, walls, branches), then tiny details (windows as dots or short vertical dashes) last.
2. LONG + SHORT: main contours are long continuous confident strokes; texture is short separate dashes that do not touch the contour.
3. OPEN LINES: shapes are almost never closed. A rock tower is an upside-down U or V drawn from the top and left open at the bottom. Buildings are boxy Π shapes open at the bottom. Leave small gaps where strokes would meet.
4. CORNERS VS WAVES: architecture, roofs and mountain peaks have sharp corners (polyline). Trees, bushes, vegetation, clouds are wavy bumpy lines with no corners.
5. PARALLELS: rivers, roads, bridges, walls are two parallel lines with even spacing that follow the bends, broken into pieces with gaps.
6. SLOPES: a hillside is a few broken diagonal wavy lines layered along the slope, plus a few short jagged strokes inside.
7. A tower roof can be 2-3 short stacked horizontal lines; a castle wall is one long curve along its outline with short vertical ticks below it for thickness and bastions.
8. SIMPLIFY HARD: leave out most of what is in the photo. The smaller a thing is, the simpler. Background clutter (distant towns, sky) is omitted unless asked for.
9. Follow the photo's real geometry: lines lie exactly on the edges they trace.
10. GEOMETRY, ALWAYS: anything that is clearly an arc (an arch, bridge arch, arched window, dome, wheel, round tower top, curved wall or river bend, rounded body) must be a clean arc cut from an ellipse or circle, never a hand-wobbly curve. Use an ellipse stroke "e" for it, rotated and squashed to match the object's perspective. Full circles and ellipses (wheels, round windows, sun) are full ellipse strokes.`;

const FORMAT = (W, H) => `COORDINATES: the drawing box is ${W} wide and ${H} tall, origin top-left, same framing as the photo. The grid image labels these coordinates every 100 units.
OUTPUT: reply with only JSON: {"strokes":[{"p":[[x,y],[x,y],...]}, ...]}
- Each stroke is one Pencil stroke, points in drawing order, integers.
- Points are joined by smooth curves. Mark a sharp corner by adding 1 as a third number: [x,y,1].
- Use as few points as the shape needs (2 for a straight line, 3-8 for a curve, more only for long wavy lines; wavy vegetation alternates small bumps).
- A single point [[x,y]] is a dot.
- An arc or ellipse is a stroke {"e":[cx,cy,rx,ry,rot,a0,a1]}: centre, two semi-axes, rotation of the rx axis in degrees, and the arc from angle a0 to a1 in degrees measured on the ellipse (0 = along the rx axis, 90 = along the ry axis, y points down). It is drawn from a0 to a1 (a1 may be smaller than a0 to go the other way). A full ellipse is a0 0, a1 360. Example: the top half of an arch 200 wide whose springing line is at y 400: {"e":[500,400,100,100,0,180,360]}.`;

/* ---------- stav ---------- */

const S = { id: null, slots: [], level: 2 };
let keySeq = 1;

const RAD = Math.PI / 180;

  if (s.e) {

  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  for (const s of strokes) {

  const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.strokes) ? raw.strokes : []);
  const out = [];
  for (const s of arr) {
    if (s && Array.isArray(s.e) && s.e.length >= 7 && s.e.slice(0, 7).every(v => isFinite(v))) {
      const e = s.e.slice(0, 7).map(Number); if (e[2] > 0 && e[3] > 0) out.push({ e }); continue;
    }
    const ps = Array.isArray(s) ? s : (s && s.p); if (!Array.isArray(ps)) continue;
    const p = ps.filter(q => Array.isArray(q) && isFinite(q[0]) && isFinite(q[1])).map(q => {
      const x = Math.max(0, Math.min(sl.W, +q[0])), y = Math.max(0, Math.min(sl.H, +q[1])); return q[2] ? [x, y, 1] : [x, y];
    });

  }
  return out;
}

/* ---------- obrázky ---------- */
const lineW = () => +$('width').value;
function canvasOf(sl, maxW, paint) {
  const sc = Math.min(1, maxW / sl.img.naturalWidth);
  const c = document.createElement('canvas'); c.width = Math.round(sl.img.naturalWidth * sc); c.height = Math.round(sl.img.naturalHeight * sc);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); paint(c, g); return c;
}
const b64 = c => c.toDataURL('image/jpeg', 0.86).split(',')[1];
const photoB64 = sl => sl.photo.split(',')[1];
function gridB64(sl) { // fotka s mriežkou a súradnicami
  return b64(canvasOf(sl, 1400, (c, g) => {
    g.drawImage(sl.img, 0, 0, c.width, c.height);
    const k = c.width / sl.W; g.lineWidth = 1; g.font = `${Math.round(13 * c.width / 1000)}px sans-serif`;
    for (let x = 0; x <= sl.W; x += 100) {
      g.strokeStyle = 'rgba(255,0,80,.55)'; g.beginPath(); g.moveTo(x * k, 0); g.lineTo(x * k, c.height); g.stroke();
      g.fillStyle = 'rgba(255,0,80,.95)'; g.fillText(x, x * k + 3, 14 * c.width / 1000);
    }
    for (let y = 0; y <= sl.H; y += 100) {
      g.strokeStyle = 'rgba(255,0,80,.55)'; g.beginPath(); g.moveTo(0, y * k); g.lineTo(c.width, y * k); g.stroke();
      g.fillStyle = 'rgba(255,0,80,.95)'; g.fillText(y, 3, y * k - 3);
    }
  }));
}
function overlayB64(sl) { // vyblednutá fotka + súčasná kresba
  return b64(canvasOf(sl, 1400, (c, g) => {
    g.globalAlpha = .4; g.drawImage(sl.img, 0, 0, c.width, c.height); g.globalAlpha = 1;
    const k = c.width / sl.W; g.scale(k, k); paintStrokes(g, sl.strokes, 9, '#000');
  }));
}
// Fotka sa pri nahratí zmenší na 1400 px (stačí na kreslenie aj uloženie návrhu).
function readPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.85);
      loadImg(data).then(im => res({ data, img: im }), rej);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

function svgText(sl, forExport) {
  const paths = sl.strokes.map(s => `<path d="${pathD(s)}"/>`).join('\n');
  const photo = (!forExport && $('showPhoto').checked) ? `<image href="${sl.photo}" x="0" y="0" width="${sl.W}" height="${sl.H}" opacity="0.38" preserveAspectRatio="none"/>` : '';
  const size = forExport ? ` width="200mm" height="${r1(200 * sl.H / sl.W)}mm"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sl.W} ${sl.H}"${size}>${forExport ? '' : `<rect width="${sl.W}" height="${sl.H}" fill="#fff"/>`}${photo}<g fill="none" stroke="#000" stroke-width="${lineW()}" stroke-linecap="round" stroke-linejoin="round">\n${paths}\n</g></svg>`;
}

let sb = null;
try { if (window.supabase) sb = window.supabase.createClient(SUPA_URL, SUPA_KEY); } catch (e) { sb = null; }
const ERR = {
  bez_pristupu: 'Kresliť môže len prihlásený rodič v Stullers Creative Studio.',
  chyba_kluc: 'Kreslenie nemá nastavený kľúč pre Claude.',

  bad_request: 'Túto fotku sa nepodarilo poslať. Skús inú.',

  invalid_json: 'Odpoveď neprišla v správnom tvare. Skús to znova.',

  nenasadene: 'Kreslenie v štúdiu ešte nie je zapnuté (chýba funkcia illustrator-draw v Supabase).',

async function callClaude(sl, prompt, images) {
  if (!sb) throw { code: 'bez_pristupu' };
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if (!token) throw { code: 'bez_pristupu' };
  let r;
  try {
    r = await fetch(FN, {
      method: 'POST', signal: sl.ctl.signal,
      headers: { 'Content-Type': 'application/json', apikey: SUPA_KEY, Authorization: 'Bearer ' + token },
      body: JSON.stringify({ system: STYLE, prompt, images }),
    });
  } catch (e) { if (e && e.name === 'AbortError') throw { code: 'cancelled' }; throw { code: 'offline' }; }
  const j = await r.json().catch(() => null);
  if (r.status === 404 && !(j && j.error)) throw { code: 'nenasadene' };
  if (!r.ok || !j || j.error) throw { code: (j && j.error) || (r.status === 401 ? 'bez_pristupu' : 'ai') };
  return j.result;
}
async function ask(sl, label, prompt, images) {
  sl.ctl = new AbortController(); sl.label = label; sl.t0 = Date.now(); setStatus(sl, ''); upd(sl); syncTop();
  try { return await callClaude(sl, prompt, images); }
  catch (e) { if (!e || e.code !== 'cancelled') setStatus(sl, ERR[e && e.code] || 'Niečo sa pokazilo. Skús to znova.', true); return null; }
  finally { sl.ctl = null; upd(sl); syncTop(); }
}
const focusOf = sl => {
  const own = sl.focus.trim(), all = $('common').value.trim();
  if (own && all) return `${all}. For this photo: ${own}`;
  return own || all || '(nič zvláštne, vyber hlavný motív sám)';
};
const strokesJSON = sl => JSON.stringify({ strokes: sl.strokes.map(s => s.e ? { e: s.e.map(Math.round) } : { p: s.p.map(q => q.map(Math.round)) }) });
function push(sl, next) { sl.hist.push(sl.strokes); if (sl.hist.length > 30) sl.hist.shift(); sl.strokes = next; upd(sl); changed(); }

async function draw(sl) {
  const L = LEVELS[sl.level - 1];
  const prompt = `TASK: Redraw the attached photo as a Štullers line drawing.
Image 1 is the clean photo. Image 2 is the same photo with a coordinate grid.
What the artist wants you to focus on (in Slovak): "${focusOf(sl)}"
Level of detail: ${L.n}/5 (${L.name}) — use between ${L.min} and ${L.max} strokes.
Work in the artist's order: dominant silhouette first, then interior, then details.

${FORMAT(sl.W, sl.H)}`;
  const r = await ask(sl, 'Kreslím', prompt, [photoB64(sl), gridB64(sl)]);
  if (!r) return;
  const s = clean(r, sl); if (!s.length) { setStatus(sl, 'Kresba prišla prázdna. Skús to znova.', true); return; }
  push(sl, s); setStatus(sl, 'Hotovo.');
}
async function more(sl) {
  const add = Math.max(5, Math.round(sl.strokes.length * 0.6));
  const prompt = `TASK: The attached images show a photo and the current Štullers drawing over it (image 1: faded photo with the drawing in black; image 2: photo with coordinate grid).
The artist wants MORE DETAIL. Keep every existing stroke. Add about ${add} new strokes: interior lines, texture dashes, secondary shapes, small details (windows, cracks, foliage bumps), in the artist's style. Do not redraw what is already drawn.
What the artist wants to focus on (in Slovak): "${focusOf(sl)}"
Current drawing: ${strokesJSON(sl)}

${FORMAT(sl.W, sl.H).replace('{"strokes":', '{"add":')}
Return ONLY the new strokes under "add".`;
  const r = await ask(sl, 'Pridávam detaily', prompt, [overlayB64(sl), gridB64(sl)]);
  if (!r) return;
  const s = clean(r && r.add ? { strokes: r.add } : r, sl); if (!s.length) { setStatus(sl, 'Neprišli žiadne nové ťahy. Skús to znova.', true); return; }
  push(sl, [...sl.strokes, ...s]); setStatus(sl, `Pridaných ${s.length} ťahov.`);
}
async function less(sl) {
  const n = sl.strokes.length, keep = Math.max(3, Math.round(n * 0.6));
  const list = sl.strokes.map((s, i) => {
    const P = pts(s), xs = P.map(q => q[0]), ys = P.map(q => q[1]);
    return `${i}: ${s.e ? 'ellipse arc' : s.p.length + ' pts'}, box ${Math.round(Math.min(...xs))},${Math.round(Math.min(...ys))}-${Math.round(Math.max(...xs))},${Math.round(Math.max(...ys))}, length ~${Math.round(len(P))}`;
  }).join('\n');
  const prompt = `TASK: Image 1 shows the current Štullers drawing in black over a faded photo; image 2 is the photo with a coordinate grid. The artist wants it SIMPLER.
Choose about ${keep} of the ${n} strokes to KEEP. Keep the dominant silhouette and the longest structural lines; drop small details, texture dashes and secondary shapes first. The result must still read clearly.
What the artist wants to focus on (in Slovak): "${focusOf(sl)}"
Strokes (index: points, bounding box, length):
${list}

Reply with only JSON: {"keep":[indices]}`;
  const r = await ask(sl, 'Zjednodušujem', prompt, [overlayB64(sl), gridB64(sl)]);
  if (!r) return;
  const k = Array.isArray(r) ? r : r.keep;
  if (!Array.isArray(k)) { setStatus(sl, 'Odpoveď neprišla v správnom tvare. Skús to znova.', true); return; }
  const set = new Set(k.map(Number)); const s = sl.strokes.filter((_, i) => set.has(i));
  if (!s.length) { setStatus(sl, 'Zostalo by prázdne plátno. Skús to znova.', true); return; }
  push(sl, s); setStatus(sl, `Ponechaných ${s.length} z ${n} ťahov.`);
}
// Všetky naraz: najviac 3 kresby súčasne, aby to Claude stíhal.
async function drawAll() {
  const queue = S.slots.filter(sl => !sl.ctl);
  if (!queue.length) return;
  queue.forEach(sl => setStatus(sl, 'Čaká na kreslenie…'));
  const worker = async () => { while (queue.length) { const sl = queue.shift(); if (S.slots.includes(sl)) await draw(sl); } };
  await Promise.all([worker(), worker(), worker()]);
}

function makeCard(sl) {

function upd(sl) {

function setStatus(sl, t, err) { sl.status = t || ''; sl.err = !!err; const c = cards.get(sl.key); if (c) { c.refs.st.textContent = sl.status; c.refs.st.classList.toggle('err', sl.err); } }
// busy overlay timer
setInterval(() => {

}, 1000);

function renderGrid() {
  const g = $('grid');
  for (const [k, c] of cards) if (!S.slots.some(s => s.key === k)) { c.el.remove(); cards.delete(k); }
  g.querySelectorAll('.empty').forEach(e => e.remove());
  S.slots.forEach(sl => { const c = cards.get(sl.key) || makeCard(sl); g.append(c.el); upd(sl); });
  if (!S.slots.length) {
    const e = document.createElement('label'); e.className = 'empty intro';
    e.innerHTML = `<div><b>Nahraj až 6 fotiek naraz</b><span>Klikni sem alebo ich sem pretiahni. Každú uvidíš vo vlastnej karte a môžeš ju kresliť a upravovať zvlášť, alebo všetky naraz.</span>
      <ul><li>Hore napíš, na čo sa sústrediť, a vyber detailnosť.</li><li>Nakresliť všetky spustí kreslenie každej fotky.</li><li>V karte: − Menej, + Viac, ↶ späť, ⤢ zväčšiť.</li><li>Uložiť uloží celý návrh aj s fotkami.</li></ul></div>
      <input type="file" accept="image/jpeg,image/png,image/webp,image/heic" multiple aria-label="Nahrať fotky">`;
    e.querySelector('input').onchange = ev => { addFiles(ev.target.files); ev.target.value = ''; };
    dropTarget(e, addFiles); g.append(e);

    e.querySelector('input').onchange = ev => { addFiles(ev.target.files); ev.target.value = ''; };

function dropTarget(el, onFiles, isCard, sl) {
  ['dragenter', 'dragover'].forEach(t => el.addEventListener(t, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); el.classList.add('over'); } }));
  ['dragleave', 'drop'].forEach(t => el.addEventListener(t, () => el.classList.remove('over')));
  el.addEventListener('drop', async e => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
    if (isCard) { // pretiahnutie na kartu = vymeniť fotku
      const f = e.dataTransfer.files[0];
      try { const p = await readPhoto(f); Object.assign(sl, { photo: p.data, img: p.img, H: Math.round(1000 * p.img.naturalHeight / p.img.naturalWidth), strokes: [], hist: [] }); upd(sl); changed(); setStatus(sl, 'Fotka vymenená. Stlač Nakresliť.'); }
      catch (err) { setStatus(sl, 'Fotku sa nepodarilo otvoriť.', true); }
    } else onFiles(e.dataTransfer.files);
  });
}
async function addFiles(list) {
  const files = [...list].filter(f => /^image\//.test(f.type) || /\.(heic|jpe?g|png|webp)$/i.test(f.name));
  const free = MAX - S.slots.length;
  if (!files.length) { toast('Toto nie sú obrázky. Nahraj JPG, PNG alebo WebP.'); return; }
  if (free <= 0) { toast('Návrh má už 6 fotiek. Niektorú odstráň alebo vymeň.'); return; }
  const use = files.slice(0, free);
  let bad = 0;
  for (const f of use) {
    try { const p = await readPhoto(f); S.slots.push(newSlot(p.data, p.img)); } catch (e) { bad++; }
  }
  renderGrid(); changed();
  const msgs = [];
  if (files.length > free) msgs.push(`Pridal som ${use.length - bad}, viac ako 6 fotiek sa do návrhu nezmestí.`);
  if (bad) msgs.push(`${bad} ${bad === 1 ? 'fotku' : 'fotky'} sa nepodarilo otvoriť (HEIC ulož ako JPG).`);
  if (msgs.length) toast(msgs.join(' '));
}
function removeSlot(sl) {
  if (sl.strokes.length && !confirm('Odstrániť túto fotku aj s kresbou z návrhu?')) return;
  if (sl.ctl) sl.ctl.abort();
  S.slots = S.slots.filter(x => x !== sl); renderGrid(); changed();
}
function syncTop() {
  const n = S.slots.length, busy = S.slots.some(s => s.ctl);
  $('count').textContent = `${n} zo ${MAX} fotiek` + (busy ? ` · kreslím ${S.slots.filter(s => s.ctl).length}` : '');
  $('drawAll').disabled = !n || S.slots.every(s => s.ctl);
  $('drawAll').textContent = S.slots.some(s => s.strokes.length) ? 'Nakresliť všetky znova' : 'Nakresliť všetky';
  $('upLabel').classList.toggle('disabled', n >= MAX);
}

const slug = s => (s || 'navrh').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'navrh';
const fileName = (sl, ext) => `${slug($('name').value)}-${S.slots.indexOf(sl) + 1}.${ext}`;
function pngOf(sl) {
  const W = 2400, H = Math.round(W * sl.H / sl.W), c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.scale(W / sl.W, W / sl.W); paintStrokes(g, sl.strokes, lineW(), '#000');
  return new Promise(r => c.toBlob(r, 'image/png'));
}
function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

// V štúdiu sa návrhy ukladajú do Supabase (tabuľka illustrator_designs, vidia ich rodičia).
// Bez prihlásenia alebo kým tabuľka nie je v Supabase, ostanú v tomto prehliadači (IndexedDB).
const Local = (() => {
  const open = () => new Promise((res, rej) => { const r = indexedDB.open('stullers-illustrator', 1); r.onupgradeneeded = () => r.result.createObjectStore('designs', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('designs', mode); const st = t.objectStore('designs'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return {
    kind: 'local',
    async list() { const all = await tx('readonly', st => st.getAll()); return (all || []).sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || '')); },
    async get(id) { return tx('readonly', st => st.get(id)); },
    async save(d) { if (!d.id || !String(d.id).startsWith('l_')) d.id = 'l_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); d.updated_at = new Date().toISOString(); await tx('readwrite', st => st.put(d)); return d.id; },
    async remove(id) { await tx('readwrite', st => st.delete(id)); },
  };
})();
const Remote = {
  kind: 'remote',
  async list() { const { data, error } = await sb.from('illustrator_designs').select('id,name,thumb,updated_at').order('updated_at', { ascending: false }); if (error) throw error; return data; },
  async get(id) { const { data, error } = await sb.from('illustrator_designs').select('id,name,state').eq('id', id).single(); if (error) throw error; return data; },
  async save(d) {
    const row = { name: d.name, state: d.state, thumb: d.thumb, updated_at: new Date().toISOString() };
    if (d.id && !String(d.id).startsWith('l_')) row.id = d.id;
    const { data, error } = await sb.from('illustrator_designs').upsert(row).select('id').single(); if (error) throw error; return data.id;
  },
  async remove(id) { const { error } = await sb.from('illustrator_designs').delete().eq('id', id); if (error) throw error; },
};
let store = Local;
async function initStore() {
  if (!sb) { note('Návrhy sa ukladajú len v tomto prehliadači. V Stullers Creative Studio sa ukladajú pre celú rodinu.'); return; }
  const { data } = await sb.auth.getSession().catch(() => ({ data: null }));
  if (!(data && data.session)) { note('Nie si prihlásený: kreslenie nepôjde a návrhy sa uložia len v tomto prehliadači. Otvor Illustrator cez Stullers Creative Studio.'); return; }
  const { error } = await sb.from('illustrator_designs').select('id').limit(1);
  if (error) { note('Ukladanie do štúdia ešte nie je zapnuté, návrhy sa zatiaľ ukladajú v tomto prehliadači.'); return; }
  store = Remote;
}
function note(t) { $('note').textContent = t; $('note').hidden = !t; }

function stateOf() {
  return {
    v: 1, width: lineW(), showPhoto: $('showPhoto').checked, common: $('common').value, level: S.level,
    slots: S.slots.map(sl => ({ photo: sl.photo, W: sl.W, H: sl.H, focus: sl.focus, level: sl.level, strokes: sl.strokes })),
  };
}
function fingerprint() {
  const st = stateOf(); st.slots = st.slots.map(s => ({ ...s, photo: s.photo.length + ':' + s.photo.slice(-40) }));
  return JSON.stringify([$('name').value, st]);
}
function thumbOf() {
  const sl = S.slots.find(s => s.strokes.length) || S.slots[0]; if (!sl) return null;
  const W = 360, H = Math.round(W * sl.H / sl.W), c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  if (!sl.strokes.length) g.drawImage(sl.img, 0, 0, W, H); else { g.scale(W / sl.W, W / sl.W); paintStrokes(g, sl.strokes, Math.max(lineW(), 6), '#000'); }
  return c.toDataURL('image/jpeg', 0.8);
}
let saving = false;
async function save(copy) {
  if (saving) return false;
  if (!S.slots.length) { toast('Návrh je prázdny, najprv nahraj fotky.'); return false; }
  saving = true; $('saveBtn').disabled = true; $('saved').textContent = 'Ukladám…';
  let name = $('name').value.trim() || 'Návrh';
  if (copy) { name = name + ' (kópia)'; $('name').value = name; }
  try {
    const id = await store.save({ id: copy ? null : S.id, name, state: stateOf(), thumb: thumbOf() });
    S.id = id; HubLeave.mark(); savedLabel(); toast(store.kind === 'remote' ? 'Uložené do štúdia' : 'Uložené v tomto prehliadači');
    return true;
  } catch (e) {
    $('saved').textContent = ''; toast('Návrh sa nepodarilo uložiť. ' + (e && e.message ? e.message : ''));
    return false;
  } finally { saving = false; $('saveBtn').disabled = false; }
}
function savedLabel() { $('saved').textContent = S.id ? (HubLeave.dirty() ? 'Neuložené zmeny' : 'Uložené') : (S.slots.length ? 'Neuložený návrh' : ''); }
let chT = 0;
function changed() { clearTimeout(chT); chT = setTimeout(savedLabel, 150); }

async function applyState(name, st, id) {
  S.slots.forEach(sl => sl.ctl && sl.ctl.abort());
  for (const c of cards.values()) c.el.remove(); cards.clear();
  S.id = id; $('name').value = name || 'Návrh';
  $('width').value = st.width || 9; $('showPhoto').checked = st.showPhoto !== false; $('common').value = st.common || '';
  S.level = st.level || 2; levelButtons($('lvAll'), () => S.level, setAllLevels);
  const slots = [];
  for (const s of (st.slots || []).slice(0, MAX)) {
    try { const img = await loadImg(s.photo); slots.push({ ...newSlot(s.photo, img), W: s.W || 1000, H: s.H || Math.round(1000 * img.naturalHeight / img.naturalWidth), focus: s.focus || '', level: s.level || 2, strokes: s.strokes || [] }); } catch (e) { /* poškodená fotka */ }
  }
  S.slots = slots; renderGrid(); HubLeave.mark(); savedLabel();
}
async function openList() {
  $('sheet').hidden = false; const L = $('list'); L.innerHTML = '<div class="none">Načítavam…</div>';
  let rows = [];
  try { rows = await store.list(); } catch (e) { L.innerHTML = '<div class="none">Návrhy sa nepodarilo načítať.</div>'; return; }
  L.innerHTML = rows.length ? '' : '<div class="none">Zatiaľ žiadne uložené návrhy.</div>';
  for (const r of rows) {
    const b = document.createElement('div'); b.className = 'item'; b.tabIndex = 0; b.setAttribute('role', 'button');
    b.innerHTML = `<img alt=""><strong></strong><small></small><button class="x" aria-label="Zmazať návrh" title="Zmazať">×</button>`;
    if (r.thumb) b.querySelector('img').src = r.thumb;
    b.querySelector('strong').textContent = r.name || 'Návrh';
    b.querySelector('small').textContent = r.updated_at ? new Date(r.updated_at).toLocaleString('sk-SK', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const go = async () => {
      if (!(await HubLeave.guard())) return;
      try { toast('Otváram…'); const d = await store.get(r.id); if (!d) throw 0; await applyState(d.name, d.state, d.id); $('sheet').hidden = true; toast('Otvorené: ' + (d.name || 'Návrh')); }
      catch (e) { toast('Návrh sa nepodarilo otvoriť.'); }
    };
    b.onclick = e => { if (e.target.closest('.x')) return; go(); };
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    b.querySelector('.x').onclick = async () => {
      if (!confirm(`Zmazať návrh „${r.name || 'Návrh'}“? Nedá sa to vrátiť.`)) return;
      try { await store.remove(r.id); if (S.id === r.id) { S.id = null; savedLabel(); } b.remove(); toast('Návrh zmazaný'); } catch (e) { toast('Návrh sa nepodarilo zmazať.'); }
    };
    L.append(b);
  }
}

/* ---------- ovládanie ---------- */
let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }
function setAllLevels(n) { S.level = n; S.slots.forEach(sl => { sl.level = n; const c = cards.get(sl.key); if (c) levelButtons(c.refs.lv, () => sl.level, m => { sl.level = m; changed(); }); }); changed(); }
levelButtons($('lvAll'), () => S.level, setAllLevels);
$('files').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('drawAll').onclick = drawAll;
$('showPhoto').onchange = () => { S.slots.forEach(upd); changed(); };
$('width').oninput = () => { S.slots.forEach(upd); changed(); };
$('common').oninput = changed; $('name').oninput = changed;
$('saveBtn').onclick = () => save(false);
$('openBtn').onclick = openList;
$('shClose').onclick = () => { $('sheet').hidden = true; };
$('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('sheet').hidden) $('sheet').hidden = true;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(false); }
});
$('newBtn').onclick = async () => { if (!(await HubLeave.guard())) return; await applyState('Nový návrh', { slots: [] }, null); };
// Fotky sa dajú pretiahnuť kamkoľvek na stránku.
addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
addEventListener('drop', e => { if (e.defaultPrevented || !e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); addFiles(e.dataTransfer.files); });

HubLeave.register({ key: 'illustrator', state: fingerprint, save: () => save(false), saveCopy: () => save(true) });
HubLeave.mark();
renderGrid(); savedLabel(); initStore();
})();
</script>
</body>
